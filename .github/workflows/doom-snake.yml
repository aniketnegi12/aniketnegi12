name: Render assets

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub minimum) — near-live LeetCode stats
  workflow_dispatch: # manual run
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render countdown SVG
        run: node scripts/doomsday-countdown.mjs

      - name: Render dashboard SVG
        run: node scripts/dashboard.mjs

      - name: Render contributions SVG
        run: node scripts/contributions.mjs

      - name: Render about panel SVG
        run: node scripts/about.mjs

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#e8302a&color_dots=#ebedf0,#f3b8b4,#ec837d,#e34a43,#c2231e
            dist/github-snake-dark.svg?color_snake=#ff6b61&color_dots=#1a1815,#3a1712,#6b1d17,#a8271f,#e8302a

      - name: Collect all assets in one folder
        run: cp generated/*.svg dist/

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
