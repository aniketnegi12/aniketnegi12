(async () => {
  const el = document.getElementById('content');
  try {
    const res = await fetch('README.md');
    let md = (res.ok && res.headers.get('content-type')?.includes('text/markdown'))
      ? await res.text()
      : document.getElementById('md-inline').textContent;
    el.innerHTML = marked.parse(md);
    // Collapse <picture>/<source> so dark-mode <source> can't 404 locally
    el.querySelectorAll('picture source').forEach(s => s.remove());
    // Resolve local assets from the embedded map
    el.querySelectorAll('img').forEach(img => {
      const raw = img.getAttribute('src') || '';
      const key = Object.keys(ASSETS).find(f => raw.includes(f));
      if (key) img.setAttribute('src', ASSETS[key]);
      img.addEventListener('error', () => {
        const ph = document.createElement('div');
        ph.style.cssText = 'border:1px dashed #f5d061;border-radius:8px;padding:14px;color:#9fe870;font-family:monospace;font-size:12px;text-align:center;background:#07090d;margin:6px 0';
        ph.textContent = '⟨ ' + (img.alt || 'asset') + ' ⟩ — appears after first push to GitHub';
        img.replaceWith(ph);
      });
    });
  } catch (e) {
    el.textContent = 'Preview failed: ' + e.message;
  }
})();
</script>
